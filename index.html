<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Asupanmu</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:'Poppins',sans-serif;
}

/* HEADER */

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:20px 15px 15px;
  border-bottom:1px solid #111;
}

.logo{
  font-size:56px;
  font-weight:800;
  background:linear-gradient(90deg,#b56cff,#7b3fff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  margin-bottom:15px;
  letter-spacing:-2px;
}

/* SEARCH */

.search-box{
  width:100%;
}

.search-box input{
  width:100%;
  padding:18px 22px;
  border:none;
  outline:none;
  border-radius:30px;
  background:#080808;
  color:#fff;
  font-size:20px;
}

.search-box input::placeholder{
  color:#777;
}

/* VIDEO GRID */

#videos{
  padding:15px;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
}

/* CARD */

.card{
  position:relative;
  overflow:hidden;
  border-radius:22px;
  background:#080808;
  min-height:280px;
}

/* SKELETON */

.card::before{
  content:'';
  position:absolute;
  inset:0;
  background:#111;
  animation:pulse 1.3s infinite;
  z-index:1;
}

@keyframes pulse{
  0%{opacity:.4;}
  50%{opacity:.9;}
  100%{opacity:.4;}
}

.card.loaded::before{
  display:none;
}

/* IMAGE */

.card img{
  width:100%;
  height:280px;
  object-fit:cover;
  display:block;
  background:#111;
  position:relative;
  z-index:2;
}

/* TITLE */

.info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:14px;
  background:linear-gradient(
    transparent,
    rgba(0,0,0,.95)
  );
  z-index:3;
}

.title{
  font-size:16px;
  font-weight:500;
  line-height:1.4;
  display:-webkit-box;
  -webkit-line-clamp:2;
  -webkit-box-orient:vertical;
  overflow:hidden;
}

/* SOURCE BADGE */

.badge{
  position:absolute;
  top:10px;
  right:10px;
  background:#8b5cf6;
  color:#fff;
  padding:7px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  z-index:4;
}

/* LOADING */

#loading{
  text-align:center;
  color:#aaa;
  padding:25px;
  font-size:18px;
}

/* ADS */

.ads{
  margin:18px 15px;
  overflow:hidden;
  border-radius:18px;
  background:#111;
  text-align:center;
}

/* MOBILE */

@media(max-width:600px){

  .logo{
    font-size:48px;
  }

  #videos{
    gap:12px;
  }

  .card img{
    height:250px;
  }

}

</style>
</head>
<body>

<!-- HEADER -->

<div class="header">

  <div class="logo">
    Asupanmu
  </div>

  <div class="search-box">
    <input
      type="text"
      id="search"
      placeholder="Search video..."
    >
  </div>

</div>

<!-- ADS TOP -->

<div class="ads">

<script async src="https://pl29427176.profitablecpmratenetwork.com/72/21/31/7221317088cb071d0f5a805d2f99458e.js"></script>

</div>

<!-- VIDEO -->

<div id="videos"></div>

<div id="loading">
  Loading video...
</div>

<!-- ADS BOTTOM -->

<div class="ads">

<script async data-cfasync="false" src="https://pl29427175.profitablecpmratenetwork.com/f7b819456e7cdf0bf9a38a0f984058c2/invoke.js"></script>

<div id="container-f7b819456e7cdf0bf9a38a0f984058c2"></div>

</div>

<script>

/* =========================
   GLOBAL
========================= */

const container =
  document.getElementById("videos");

const loading =
  document.getElementById("loading");

const search =
  document.getElementById("search");

let page = 1;
let loadingData = false;
let allVideos = [];

/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  if(loadingData) return;

  loadingData = true;

  loading.style.display = "block";

  try{

    const res = await fetch(
      `/api/videos?page=${page}`
    );

    const data = await res.json();

    if(!Array.isArray(data) || !data.length){

      loading.innerHTML =
        "Semua video selesai dimuat";

      return;
    }

    // FILTER DUPLIKAT

    const unique =
      data.filter(v =>
        !allVideos.some(
          x => x.id === v.id
        )
      );

    allVideos.push(...unique);

    appendVideos(unique);

    page++;

  }catch(err){

    console.log(err);

    loading.innerHTML =
      "Gagal memuat video";

  }

  loadingData = false;

}

/* =========================
   APPEND VIDEOS
========================= */

function appendVideos(videos){

  videos.forEach(video => {

    const card =
      document.createElement("a");

    card.className = "card";

    card.href = video.watch;

    card.target = "_blank";

    card.innerHTML = `

      <div class="badge">
        ${video.source}
      </div>

      <img
        src="${video.thumbnail || 'https://via.placeholder.com/300x450?text=Asupanmu'}"
        alt="${video.title}"
        loading="lazy"
        referrerpolicy="no-referrer"
      >

      <div class="info">

        <div class="title">
          ${video.title}
        </div>

      </div>

    `;

    const img =
      card.querySelector("img");

    img.onload = () => {

      card.classList.add("loaded");

    };

    img.onerror = () => {

      img.src =
      "https://via.placeholder.com/300x450?text=No+Image";

      card.classList.add("loaded");

    };

    container.appendChild(card);

  });

}

/* =========================
   SEARCH
========================= */

search.addEventListener(
  "input",
  e => {

    const key =
      e.target.value.toLowerCase();

    container.innerHTML = "";

    const filtered =
      allVideos.filter(v =>
        v.title.toLowerCase()
        .includes(key)
      );

    appendVideos(filtered);

  }
);

/* =========================
   INFINITE SCROLL
========================= */

window.addEventListener(
  "scroll",
  () => {

    if(

      window.innerHeight +
      window.scrollY >=

      document.body.offsetHeight - 1000

    ){

      loadVideos();

    }

  }
);

/* =========================
   START
========================= */

loadVideos();

</script>

</body>
</html>
