<!-- index.html -->

<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Asupanmu</title>

<style>

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

/* NAVBAR */

.navbar{

  position:sticky;
  top:0;
  z-index:999;

  background:#000;

  padding:15px;

  border-bottom:
  1px solid #111;

}

.logo{

  font-size:38px;
  font-weight:bold;

  color:#8b5cf6;

  margin-bottom:12px;

  letter-spacing:1px;

}

#search{

  width:100%;

  padding:14px;

  border:none;

  border-radius:18px;

  background:#111;

  color:white;

  font-size:16px;

  outline:none;

  box-sizing:border-box;

}

/* GRID */

.grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:14px;

  padding:14px;

}

/* CARD */

.card{

  position:relative;

  overflow:hidden;

  border-radius:18px;

  background:#111;

  text-decoration:none;

  color:white;

}

.card img{

  width:100%;

  height:320px;

  object-fit:cover;

  display:block;

}

/* TITLE */

.title{

  position:absolute;

  bottom:0;
  left:0;
  right:0;

  padding:12px;

  font-size:15px;

  background:
  linear-gradient(
    transparent,
    rgba(0,0,0,.95)
  );

}

/* LOADING */

.loading{

  text-align:center;

  padding:20px;

  color:#aaa;

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    Asupanmu
  </div>

  <input
    type="text"
    id="search"
    placeholder="Search video..."
  >

</div>

<!-- VIDEO GRID -->

<div
id="videos"
class="grid">
</div>

<div
id="loading"
class="loading">
Loading...
</div>

<script>

// STATE

let page = 1;

let loading = false;

let finished = false;

let allVideos = [];

// ELEMENT

const container =
document.getElementById("videos");

const loadingText =
document.getElementById("loading");

const search =
document.getElementById("search");

// LOAD VIDEO

async function loadVideos() {

  if (loading || finished) return;

  loading = true;

  loadingText.innerText =
  "Loading...";

  try {

    const res =
    await fetch(`/api/videos?page=${page}`);

    const videos =
    await res.json();

    if (!videos.length) {

      finished = true;

      loadingText.innerText =
      "Semua video selesai dimuat";

      return;

    }

    allVideos.push(...videos);

    appendVideos(videos);

    page++;

  } catch(err) {

    console.log(err);

    loadingText.innerText =
    "Gagal load video";

  }

  loading = false;
}

// TAMPILKAN VIDEO

function appendVideos(videos) {

  videos.forEach(video => {

    const card =
    document.createElement("a");

    // LINK HALAMAN ASLI VIZEY
    card.href = video.watch;

    card.target = "_blank";

    card.rel =
    "noopener noreferrer";

    card.className = "card";

    card.innerHTML = `

      <img
        src="${video.thumbnail}"
        loading="lazy"
      >

      <div class="title">
        ${video.title}
      </div>

    `;

    container.appendChild(card);

  });

}

// SEARCH

search.addEventListener("input", e => {

  const key =
  e.target.value.toLowerCase();

  container.innerHTML = "";

  const filtered =
  allVideos.filter(v =>

    v.title
    .toLowerCase()
    .includes(key)

  );

  appendVideos(filtered);

});

// INFINITE SCROLL

window.onscroll = () => {

  if (

    window.innerHeight +
    window.scrollY >=

    document.documentElement
    .scrollHeight - 500

  ) {

    loadVideos();

  }

};

// START

loadVideos();

</script>

</body>
</html>
