<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Asupanmu</title>

<link rel="manifest" href="/manifest.json">

<meta name="theme-color" content="#8b5cf6">

<style>

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

.header{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:15px;
  border-bottom:1px solid #111;
}

.logo{
  font-size:42px;
  font-weight:bold;
  color:#8b5cf6;
}

#search{
  width:100%;
  margin-top:12px;
  padding:14px;
  border:none;
  border-radius:15px;
  background:#111;
  color:#fff;
}

#videos{
  display:grid;
  grid-template-columns:
  repeat(2,1fr);
  gap:12px;
  padding:12px;
}

.card{
  position:relative;
  overflow:hidden;
  border-radius:18px;
  background:#111;
  text-decoration:none;
  color:#fff;
}

.card img{
  width:100%;
  height:260px;
  object-fit:cover;
  display:block;
}

.info{
  position:absolute;
  bottom:0;
  left:0;
  right:0;
  padding:12px;
  background:
  linear-gradient(
    transparent,
    rgba(0,0,0,.95)
  );
}

.title{
  font-size:14px;
}

.badge{
  position:absolute;
  top:10px;
  right:10px;
  background:#8b5cf6;
  padding:5px 10px;
  border-radius:999px;
  font-size:11px;
}

.loading{
  text-align:center;
  padding:20px;
  color:#aaa;
}

.sticky-ads{
  position:fixed;
  bottom:0;
  left:0;
  width:100%;
  background:#111;
  z-index:9999;
  text-align:center;
}

</style>

</head>

<body>

<div class="header">

  <div class="logo">
    Asupanmu
  </div>

  <input
    type="text"
    id="search"
    placeholder="Search..."
  >

</div>

<div id="videos"></div>

<div
id="loading"
class="loading">
Loading...
</div>

<!-- STICKY ADS -->

<div class="sticky-ads">

<script async src="https://pl29474507.effectivecpmnetwork.com/27/09/ec/2709ec349ac9719e1e7b4da1e1f6f8f6.js"></script>

</div>

<script>

if("serviceWorker" in navigator){

  navigator.serviceWorker.register(
    "/sw.js"
  );

}

let page = 1;

let loading = false;

let allVideos = [];

const container =
document.getElementById("videos");

const loadingText =
document.getElementById("loading");

const search =
document.getElementById("search");

async function loadVideos(){

  if(loading) return;

  loading = true;

  try{

    const res =
    await fetch(`/api/videos?page=${page}`);

    const data =
    await res.json();

    if(
      !Array.isArray(data) ||
      !data.length
    ){

      loadingText.innerHTML =
      "Semua video selesai";

      return;

    }

    appendVideos(data);

    allVideos.push(...data);

    page++;

  }catch(err){

    loadingText.innerHTML =
    "Gagal load";

  }

  loading = false;

}

function appendVideos(videos){

  videos.forEach(video=>{

    const card =
    document.createElement("a");

    card.href =
    video.watch;

    card.target =
    "_blank";

    card.className =
    "card";

    card.innerHTML = `

      <div class="badge">
        ${video.source}
      </div>

      <img
        src="${video.thumbnail}"
        loading="lazy"
      >

      <div class="info">

        <div class="title">
          ${video.title}
        </div>

      </div>

    `;

    container.appendChild(card);

  });

}

search.addEventListener(
"input",
e=>{

  const key =
  e.target.value.toLowerCase();

  container.innerHTML = "";

  const filtered =
  allVideos.filter(v=>

    v.title
    .toLowerCase()
    .includes(key)

  );

  appendVideos(filtered);

});

window.addEventListener(
"scroll",
()=>{

  if(

    window.innerHeight +
    window.scrollY >=

    document.body.offsetHeight - 1000

  ){

    loadVideos();

  }

});

loadVideos();

</script>

</body>
</html>
