<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  background:#000;
  color:#fff;
  font-family:Arial,sans-serif;
}

/* NAVBAR */

.navbar{

  position:sticky;
  top:0;
  z-index:999;

  background:rgba(0,0,0,.95);

  backdrop-filter:blur(10px);

  padding:15px;

  border-bottom:1px solid #111;

}

.logo{

  font-size:42px;
  font-weight:900;

  color:#8b5cf6;

  margin-bottom:12px;

  letter-spacing:-2px;

}

#search{

  width:100%;

  padding:14px;

  border:none;

  border-radius:18px;

  background:#111;

  color:white;

  font-size:16px;

  outline:none;

}

/* GRID */

.grid{

  display:grid;

  grid-template-columns:
  repeat(2,1fr);

  gap:14px;

  padding:14px;

}

/* CARD */

.card{

  position:relative;

  overflow:hidden;

  border-radius:18px;

  text-decoration:none;

  color:white;

  background:#111;

}

.card img{

  width:100%;

  height:320px;

  object-fit:cover;

  display:block;

  background:#111;

}

/* TITLE */

.title{

  position:absolute;

  left:0;
  right:0;
  bottom:0;

  padding:12px;

  background:
  linear-gradient(
    transparent,
    rgba(0,0,0,.95)
  );

  font-size:14px;

}

/* SOURCE */

.source{

  position:absolute;

  top:10px;
  right:10px;

  background:#8b5cf6;

  color:white;

  padding:5px 10px;

  border-radius:10px;

  font-size:11px;

  font-weight:bold;

}

/* LOADING */

.loading{

  text-align:center;

  color:#aaa;

  padding:20px;

}

/* ADS */

.ads-box{

  width:100%;

  overflow:hidden;

  display:flex;

  justify-content:center;

  align-items:center;

  margin:10px 0;

}

</style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">

  <div class="logo">
    Asupanmu
  </div>

  <input
    type="text"
    id="search"
    placeholder="Search video..."
  >

</div>

<!-- TOP ADS -->

<div class="ads-box">

  <div id="top-ad"></div>

</div>

<!-- VIDEO -->

<div
id="videos"
class="grid">
</div>

<!-- LOADING -->

<div
id="loading"
class="loading">
Loading...
</div>

<script>

/* =========================
   VARIABLES
========================= */

let page = 1;

let loading = false;

let finished = false;

let allVideos = [];

/* simpan ID video */

const loadedIds = new Set();

const container =
document.getElementById("videos");

const search =
document.getElementById("search");

const loadingText =
document.getElementById("loading");

/* =========================
   TOP ADS
========================= */

function loadTopAds(){

  const adBox =
  document.getElementById("top-ad");

  const script =
  document.createElement("script");

  script.async = true;

  script.src =
  "https://pl29427175.profitablecpmratenetwork.com/f7b819456e7cdf0bf9a38a0f984058c2/invoke.js";

  adBox.appendChild(script);

  /* social bar */

  const social =
  document.createElement("script");

  social.src =
  "https://pl29427176.profitablecpmratenetwork.com/72/21/31/7221317088cb071d0f5a805d2f99458e.js";

  document.body.appendChild(social);

}

/* =========================
   LOAD VIDEOS
========================= */

async function loadVideos(){

  if(loading || finished) return;

  loading = true;

  loadingText.innerText =
  "Loading...";

  try{

    const res =
    await fetch(`/api/videos?page=${page}`);

    const videos =
    await res.json();

    console.log(videos);

    if(
      !Array.isArray(videos) ||
      videos.length === 0
    ){

      finished = true;

      loadingText.innerText =
      "Semua video selesai dimuat";

      return;

    }

    /* FILTER DUPLICATE */

    const uniqueVideos = videos

.sort((a,b)=>{

  return new Date(b.createdAt)
  - new Date(a.createdAt);

})

.filter(v=>{

  if(
    !v.id ||
    loadedIds.has(v.id)
  ){

    return false;

  }

  loadedIds.add(v.id);

  return true;

});

    if(uniqueVideos.length === 0){

      page++;

      loading = false;

      loadVideos();

      return;

    }

    appendVideos(uniqueVideos);

    allVideos.push(...uniqueVideos);

    page++;

  }catch(err){

    console.log(err);

    loadingText.innerText =
    "Gagal load video";

  }

  loading = false;

}

/* =========================
   APPEND VIDEOS
========================= */

function appendVideos(videos){

  videos.forEach((video,index)=>{

    if(!video.thumbnail) return;

    const card =
    document.createElement("a");

    card.href =
    video.watch || "#";

    card.target =
    "_blank";

    card.rel =
    "noopener noreferrer";

    card.className =
    "card";

    card.innerHTML = `

      <img
        src="${video.thumbnail}"
        alt="${video.title}"
        loading="lazy"
      >

      <div class="source">
        ${video.source || "VIDEO"}
      </div>

      <div class="title">
        ${video.title || "No Title"}
      </div>

    `;

    container.appendChild(card);

    /* ADS setiap 15 video */

    if(index % 15 === 0 && index !== 0){

      createInlineAds(index);

    }

  });

}

/* =========================
   INLINE ADS
========================= */

function createInlineAds(index){

  const ads =
  document.createElement("div");

  ads.className =
  "ads-box";

  ads.style.gridColumn =
  "span 2";

  const iframe =
  document.createElement("iframe");

  iframe.src =
  "https://www.profitablecpmratenetwork.com/k2x9zpa1y?key=e0134ec760109876f301830cf34ed8d6";

  iframe.width = "100%";

  iframe.height = "100";

  iframe.style.border =
  "none";

  iframe.style.borderRadius =
  "14px";

  ads.appendChild(iframe);

  container.appendChild(ads);

}

/* =========================
   SEARCH
========================= */

search.addEventListener(
"input",
e=>{

  const key =
  e.target.value.toLowerCase();

  container.innerHTML = "";

  const filtered =
  allVideos.filter(v=>

    (v.title || "")
    .toLowerCase()
    .includes(key)

  );

  appendVideos(filtered);

});

/* =========================
   INFINITE SCROLL
========================= */

window.addEventListener(
"scroll",
()=>{

  if(

    window.innerHeight +
    window.scrollY >=

    document.documentElement
    .scrollHeight - 700

  ){

    loadVideos();

  }

});

/* =========================
   START
========================= */

loadTopAds();

loadVideos();

</script>
