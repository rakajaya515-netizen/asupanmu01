<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Asupanmu</title>

<style>

body{
  margin:0;
  background:#000;
  color:#fff;
  font-family:sans-serif;
}

.navbar{
  position:sticky;
  top:0;
  z-index:999;
  background:#000;
  padding:15px;
}

.logo{
  color:#8b5cf6;
  font-size:40px;
  font-weight:bold;
}

#search{
  width:100%;
  padding:14px;
  margin-top:10px;
  border:none;
  border-radius:15px;
  background:#111;
  color:white;
}

.grid{
  display:grid;
  grid-template-columns:
  repeat(2,1fr);

  gap:14px;
  padding:14px;
}

.card{
  position:relative;
  border-radius:18px;
  overflow:hidden;
  text-decoration:none;
  color:white;
}

.card img{
  width:100%;
  height:300px;
  object-fit:cover;
}

.title{
  position:absolute;
  bottom:0;
  left:0;
  right:0;

  padding:10px;

  background:
  linear-gradient(
    transparent,
    rgba(0,0,0,.9)
  );
}

</style>

</head>
<body>

<div class="navbar">

<div class="logo">
Asupanmu
</div>

<input
type="text"
id="search"
placeholder="Search video..."
>

</div>

<div
id="videos"
class="grid">
</div>


<script>

let page = 1;
let loading = false;
let finished = false;

const container =
document.getElementById("videos");

const search =
document.getElementById("search");

let allVideos = [];

async function loadVideos() {

  if (loading || finished) return;

  loading = true;

  try {

    const res =
    await fetch(`/api/videos?page=${page}`);

    const videos =
    await res.json();

    if (!videos.length) {

      finished = true;
      return;

    }

    allVideos.push(...videos);

    appendVideos(videos);

    page++;

  } catch(err) {

    console.log(err);

  }

  loading = false;
}

function appendVideos(videos) {

  videos.forEach(video => {

    const card =
    document.createElement("a");

    card.href = video.watch;

    card.target = "_blank";

    card.className = "card";

    card.innerHTML = `
      <img src="${video.thumbnail}">
      <div class="title">
        ${video.title}
      </div>
    `;

    container.appendChild(card);

  });

}

search.addEventListener("input", e => {

  const key =
  e.target.value.toLowerCase();

  container.innerHTML = "";

  const filtered =
  allVideos.filter(v =>
    v.title.toLowerCase()
    .includes(key)
  );

  appendVideos(filtered);

});


// INFINITE SCROLL FIX
window.onscroll = () => {

  if (
    window.innerHeight +
    window.scrollY >=
    document.documentElement.scrollHeight - 300
  ) {

    loadVideos();

  }

};

loadVideos();

</script>
